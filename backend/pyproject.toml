[project]
name = "paper-studio-backend"
version = "0.1.0"
description = "研稿·Paper Studio — 科研论文协作写作与投稿后端（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-docx==1.2.0",
    "lxml>=5,<7",
    "pypdf>=5,<7",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8,<4",
    "pillow>=10,<13",
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "aiosqlite>=0.22.1,<0.23",
    "httpx>=0.27,<1",
    "bibtexparser>=1.4,<2",
    "citeproc-py>=0.8",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B011", "B904", "B905", "UP009", "UP031", "E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
