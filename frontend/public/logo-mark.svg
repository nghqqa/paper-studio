<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 研稿 · Paper Studio logo：论文页 + 段落行 + 批注标记 的抽象结构 -->
  <defs>
    <clipPath id="pg"><rect x="0" y="0" width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#162732"/>
  <g clip-path="url(#pg)">
    <!-- 论文页（左侧白页） -->
    <rect x="14" y="12" width="26" height="40" rx="3" fill="#F8F7F2"/>
    <!-- 段落行 -->
    <rect x="19" y="19" width="16" height="2.6" rx="1.3" fill="#162732" opacity="0.85"/>
    <rect x="19" y="25" width="16" height="2" rx="1" fill="#162732" opacity="0.45"/>
    <rect x="19" y="30" width="12" height="2" rx="1" fill="#162732" opacity="0.45"/>
    <rect x="19" y="38" width="16" height="2" rx="1" fill="#162732" opacity="0.45"/>
    <rect x="19" y="43" width="10" height="2" rx="1" fill="#162732" opacity="0.45"/>
    <!-- 批注标记：右侧竖条 + 气泡点（品牌绿） -->
    <rect x="45" y="14" width="5" height="26" rx="2.5" fill="#18875E"/>
    <circle cx="47.5" cy="46" r="4" fill="#18875E"/>
  </g>
</svg>
