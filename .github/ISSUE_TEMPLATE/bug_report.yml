name: Bug Report
description: Report a bug or unexpected behavior in Paper Studio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Word / LaTeX project...
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Writing mode
      options:
        - LaTeX
        - Word (ONLYOFFICE)
        - Both / Platform-wide
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Image tag & Deployment environment
      placeholder: "e.g. v0.9.0 / Docker on Ubuntu 22.04 + ONLYOFFICE 10.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: text
