name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b --force
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Unit tests
        working-directory: frontend
        run: pnpm test -- --maxWorkers=2 --testTimeout=30000

  backend:
    name: Backend (core tests + plugin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run core paper tests
        working-directory: backend
        env:
          PYTHONPATH: src
        run: |
          uv run pytest \
            tests/test_paper_template_assets.py \
            tests/test_paper_templates_admin.py \
            tests/test_word_editor.py \
            tests/test_word_preflight.py \
            tests/test_csl_styles.py \
            tests/test_rebuttal.py \
            tests/test_paper_proposals.py \
            -q
      - name: Run ONLYOFFICE plugin tests
        run: |
          node --test backend/app/office_plugin/tests/*.test.cjs

  oss-hygiene:
    name: Open-source Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit repository hygiene
        run: python scripts/export_oss.py --audit-only
