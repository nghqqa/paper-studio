name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b --force
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Unit tests (Paper Studio core suites)
        working-directory: frontend
        run: pnpm exec vitest run --reporter=dot --maxWorkers=2 --testTimeout=30000

  backend:
    name: Backend (core tests + plugin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff lint (Paper core)
        working-directory: backend
        run: uv run ruff check app
      - name: Run core paper tests
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_paper_template_assets.py \
            tests/test_paper_templates_admin.py \
            tests/test_word_editor.py \
            tests/test_word_preflight.py \
            tests/test_csl_styles.py \
            tests/test_rebuttal.py \
            tests/test_paper_proposals.py \
            tests/test_gbt7714.py \
            tests/test_word_citations.py \
            -q
          uv run pytest \
            tests/test_pandoc_runner.py \
            tests/test_latex_word.py \
            tests/test_latex_import_docx.py \
            tests/test_latex_preflight.py \
            tests/test_latex_files_panel.py \
            tests/test_latex_history.py \
            tests/test_library.py \
            tests/test_library_cache.py \
            tests/test_zotero.py \
            tests/test_zotero_credentials.py \
            tests/test_zotero_refresh.py \
            tests/test_project_figures.py \
            -q
          uv run pytest tests/test_showcase_demo.py -q
          uv run pytest tests/test_citation_verify.py -q
          uv run pytest tests/test_admin_doctor.py -q
          uv run pytest tests/test_public_share_paper.py -q
          uv run pytest tests/test_latex_comments.py -q
          uv run pytest tests/test_ai_polish.py -q
          uv run pytest tests/test_ai_quota.py -q
          uv run pytest tests/test_user_ai.py -q
          uv run pytest tests/test_wave1_enhancements.py tests/test_wave2_features.py tests/test_wave3_features.py -q
      - name: Run ONLYOFFICE plugin tests
        run: |
          node --test backend/app/office_plugin/tests/*.test.cjs

  oss-hygiene:
    name: Open-source Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit repository hygiene
        run: python scripts/export_oss.py --audit-only
